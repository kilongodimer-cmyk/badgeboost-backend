<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BadgeBoost - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <header class="bg-white border-b border-slate-200 py-4 px-8 flex justify-between items-center shadow-sm">
        <h1 class="text-2xl font-bold text-indigo-600">BadgeBoost 🚀</h1>
        <button id="upgradeBtn" onclick="checkout()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-5 rounded-lg shadow transition">
            Passer à Pro (15$/mois)
        </button>
    </header>

    <main class="max-w-4xl mx-auto py-10 px-4 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Personnalisation -->
        <section class="bg-white p-6 rounded-xl shadow border border-slate-100">
            <h2 class="text-xl font-bold mb-4">1. Personnaliser votre badge</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Texte du badge :</label>
                <input type="text" id="badgeText" value="Garantie Satisfait ou Remboursé" class="w-full border border-slate-300 p-2 rounded-md focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Couleur du badge :</label>
                <input type="color" id="bgColor" value="#10B981" class="h-10 w-full cursor-pointer rounded border border-slate-300 p-1">
            </div>

            <h2 class="text-lg font-semibold mt-6 mb-2">Aperçu en direct :</h2>
            <div class="p-6 bg-slate-100 rounded-lg flex justify-center items-center">
                <div id="badgePreview" class="px-4 py-2 rounded-full text-white font-medium text-sm shadow" style="background-color: #10B981;">
                    Garantie Satisfait ou Remboursé
                </div>
            </div>
        </section>

        <!-- Intégration -->
        <section class="bg-white p-6 rounded-xl shadow border border-slate-100 flex flex-col justify-between">
            <div>
                <h2 class="text-xl font-bold mb-4">2. Code d'intégration</h2>
                <p class="text-sm text-slate-600 mb-3">Copiez ce code et collez-le sur votre boutique (Shopify, WooCommerce, HTML) :</p>
                
                <textarea id="embedCode" readonly class="w-full h-32 bg-slate-900 text-green-400 font-mono text-xs p-3 rounded-lg resize-none"></textarea>
            </div>

            <button onclick="copyCode()" class="mt-4 w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 rounded-md transition">
                Copier le code HTML
            </button>
        </section>

    </main>

    <script>
        const API_KEY = "votre_cle_api_test"; // Remplace par une clé API client réelle
        const CLIENT_ID = "client_123";

        // Mettre à jour le snippet de code
        const embedCodeInput = document.getElementById("embedCode");
        embedCodeInput.value = `<div id="badgeboost-container"></div>\n<script src="https://badgeboost-backend.onrender.com/widget.js" data-api-key="${API_KEY}"><\/script>`;

        // Redirection vers le Checkout Stripe
        async function checkout() {
            const btn = document.getElementById("upgradeBtn");
            btn.innerText = "Chargement...";
            btn.disabled = true;

            try {
                const response = await fetch(`https://badgeboost-backend.onrender.com/api/v1/create-checkout-session?client_id=${CLIENT_ID}`, {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert("Erreur lors de la création de la session Stripe");
                }
            } catch (err) {
                alert("Erreur serveur");
            } finally {
                btn.innerText = "Passer à Pro (15$/mois)";
                btn.disabled = false;
            }
        }

        function copyCode() {
            embedCodeInput.select();
            document.execCommand('copy');
            alert('Code copié dans le presse-papier !');
        }
    </script>
</body>
</html>
